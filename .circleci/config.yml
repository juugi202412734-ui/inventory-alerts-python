version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.11

    steps:
      - checkout

      - restore_cache:
          keys:
            - dependencies-{{ checksum "requirements.txt" }}

      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt

      - save_cache:
          paths:
            - ~/.cache/pip
          key: dependencies-{{ checksum "requirements.txt" }}

      - run:
          name: Run tests
          command: |
            python -m pytest

workflows:
  build-and-test:
    jobs:
      - build-and-test